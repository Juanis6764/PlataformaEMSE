services:
  - type: web
    name: emse-api
    runtime: node
    rootDir: backend
    plan: free
    # En Render Free no existe preDeployCommand; las migraciones se aplican
    # durante cada build antes de compilar e iniciar la API.
    # NODE_ENV=production evita instalar devDependencies por defecto. Nest CLI
    # se necesita solo durante el build, por eso se incluyen explícitamente.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 8h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
